name: Test & Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "checks-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @ugurdemirel/landcraft
        # The storybook typecheck resolves @ugurdemirel/landcraft to its
        # dist/index.d.ts, so the package must be built first.
        run: pnpm --filter @ugurdemirel/landcraft build

      - name: Run tests
        run: pnpm --filter @ugurdemirel/landcraft test

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify the library build is up to date
        run: test -d packages/ui/dist && test -f packages/ui/dist/index.d.ts
